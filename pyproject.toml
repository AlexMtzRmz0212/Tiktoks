[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-archive"
version = "0.1.0"
description = "Turn saved TikTok videos into a searchable Postgres archive with a generated Obsidian vault."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.10",
    "faster-whisper>=1.2",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "sentence-transformers>=3.0",
    "truststore>=0.10",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiktok_archive = ["ui/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
